<!DOCTYPE html>
<html>
<head>
    <title>CBT Exam - Ongoing</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .header-bar { position: sticky; top: 0; background: #343a40; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .question-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; border-left: 6px solid #007bff; }
        .question-text { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 20px; display: block; }
        .option-label { display: block; background: #f8f9fa; padding: 12px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; border: 1px solid #ddd; transition: 0.2s; }
        .option-label:hover { background: #e9ecef; border-color: #007bff; }
        input[type="radio"] { margin-right: 15px; transform: scale(1.3); cursor: pointer; }
        .submit-btn { background-color: #28a745; color: white; border: none; padding: 18px; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; width: 100%; margin-top: 20px; margin-bottom: 50px; transition: 0.3s; }
        .submit-btn:hover { background-color: #218838; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .live-badge { background: #ffc107; color: #000; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>
            <span>Candidate: <strong>{{ username }}</strong></span>
            <span style="margin-left: 20px;">Matric: <strong>{{ matric }}</strong></span>
        </div>
        <div class="live-badge">LIVE EXAM MODE</div>
    </div>

    <div class="container">
        <form action="/quiz" method="POST">
            <input type="hidden" name="username" value="{{ username }}">
            <input type="hidden" name="matric" value="{{ matric }}">

            {% for q in questions %}
                {% set q_index = loop.index0 %}
                <div class="question-card">
                    <span class="question-text">{{ loop.index }}. {{ q.question }}</span>
                    
                    <div class="options-container">
                        {% for option in q.options %}
                        <label class="option-label">
                            <input type="radio" name="q{{ q_index }}" value="{{ option }}" required>
                            {{ option }}
                        </label>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}

            <button type="submit" class="submit-btn" onclick="return confirm('Are you sure you want to submit your exam?')">
                FINISH AND SUBMIT TEST
            </button>
        </form>
    </div>

</body>
</html>
